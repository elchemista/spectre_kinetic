<svg xmlns="http://www.w3.org/2000/svg" width="700" height="100" viewBox="0 0 700 100"
     role="img" aria-labelledby="title description">
  <title id="title">From model output to a governed action</title>
  <desc id="description">Kinetic prepares a proposal from Action Language. The Server submits
    it with propose/4. GAM authorizes the registered action before execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6"
            orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="700" height="100" rx="12" fill="#0f172a"/>
  <g fill="#1e293b" stroke="#475569">
    <rect x="12" y="22" width="130" height="56" rx="8"/>
    <rect x="165" y="22" width="106" height="56" rx="8"/>
    <rect x="390" y="22" width="106" height="56" rx="8" stroke="#5eead4"/>
    <rect x="519" y="22" width="169" height="56" rx="8"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M146 50h14"/>
    <path d="M276 55h109"/>
    <path d="M500 50h14"/>
  </g>
  <g fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600"
     text-anchor="middle">
    <text x="77" y="45">Model output</text>
    <text x="218" y="45">Kinetic</text>
    <text x="443" y="45">GAM</text>
    <text x="603.5" y="45">Registered action</text>
  </g>
  <g fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    <text x="77" y="63">Action Language</text>
    <text x="218" y="63">Prepare</text>
    <text x="443" y="63">Authorize</text>
    <text x="603.5" y="63">Execute</text>
    <text x="330" y="44" font-family="monospace">propose/4</text>
  </g>
</svg>
